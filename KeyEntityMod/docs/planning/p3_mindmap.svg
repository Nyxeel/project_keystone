<text x="900" y="42" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f2937">Phase 3 Mindmap — Definition-Loader-Durchlauf</text>
<text x="900" y="73" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#4b5563">Von loadDefinitions() bis zur atomisch ersetzten NpcDefinitionRegistry — ohne Spawn, ohne Runtime, ohne state.json-Änderung</text>

